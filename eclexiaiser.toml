# eclexiaiser manifest for cloudguard-server

[project]
name = "cloudguard-server"

[[functions]]
name = "serve"
source = "src/main.rs"
energy-budget-mj = 100.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
